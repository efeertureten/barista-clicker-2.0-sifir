name: Android paketi

# Her main güncellemesinde Android paketi derlenir ve "Artifacts" altına konur.
# İmza sırları varsa ve bu sürüm (package.json) henüz yayınlanmadıysa imzalı APK, v<sürüm> adıyla bir GitHub
# sürümü olarak yayınlanır: arkadaşlar telefondan indirip kurar. Yani sürüm numarasını artırmak = yeni sürüm.
# İmza için iki depo sırrı gerekir: ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD (README: Android).
# Sırlar yoksa telefona kurulabilen ayrı bir deneme uygulaması (Barista Deneme) üretilir.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # sürüm yayını için
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Sürüm kontrolü
        run: node tools/android/check-version.mjs

      - name: Oyunu derle ve Android projesine kopyala
        run: |
          npm run build
          npx cap sync android

      - name: Yükleme anahtarı
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # Sır yok: imza ayarlarının çalıştığı geçici bir anahtarla denenir; bu paket dağıtılmaz
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/upload.jks" -alias upload \
              -keyalg RSA -keysize 2048 -validity 2 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Gecici imza denemesi" 2> /dev/null
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Yükleme anahtarı sırları yok: deneme uygulaması (Barista Deneme) üretiliyor; imza geçici anahtarla sınanıyor, yayın yok."
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: İmzasız sürüm yayınlanmaz
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed != 'true'
        run: |
          echo "::error::Etiketli sürüm için ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD sırları gerekli."
          exit 1

      - name: Derle
        working-directory: android
        run: |
          chmod +x gradlew
          TASKS="assembleRelease bundleRelease"
          if [ "${{ steps.key.outputs.signed }}" != "true" ]; then TASKS="$TASKS assembleDebug"; fi
          ./gradlew --no-daemon $TASKS

      - name: Paketleri denetle ve adlandır
        id: out
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CHECK="$APK"
          [ "${{ steps.key.outputs.signed }}" != "true" ] && CHECK="$CHECK android/app/build/outputs/apk/debug/app-debug.apk"
          for f in $CHECK; do
            "$BT/apksigner" verify --print-certs "$f" > signer.txt
            "$BT/aapt2" dump badging "$f" > badging.txt
            unzip -l "$f" > files.txt
            if ! grep -q 'assets/public/index.html' files.txt; then
              echo "::error::$f içinde oyun dosyaları yok (assets/public/index.html)"
              exit 1
            fi
            PKG=$(sed -n '1p' badging.txt | cut -c1-160)
            SDK=$(grep -E '^(sdkVersion|targetSdkVersion)' badging.txt | tr '\n' ' ' || true)
            LABEL=$(grep -m1 "^application-label:" badging.txt || true)
            CERT=$(grep -m1 -E 'certificate DN|SHA-256 digest' signer.txt | tr '\n' ' ' || true)
            PERMS=$(grep -oE "^uses-permission: name='[^']+'" badging.txt | sed "s/.*android.permission.//; s/'//g" | tr '\n' ' ' || true)
            SIZE=$(du -k "$f" | cut -f1)
            echo "::notice title=$(basename "$f")::$PKG · $SDK · $LABEL · $SIZE KB · $CERT · izinler: $PERMS"
          done
          jarsigner -verify "$AAB" > aab.txt 2>&1 || true
          if ! grep -q "jar verified" aab.txt; then
            echo "::error::AAB imzalı değil"
            cat aab.txt
            exit 1
          fi
          mkdir -p out
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            cp "$APK" "out/barista-clicker-$V.apk"
            cp "$AAB" "out/barista-clicker-$V.aab"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "out/barista-deneme-$V.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: barista-clicker-android-${{ steps.out.outputs.version }}
          path: out/
          if-no-files-found: error

      - name: Sürüm yayını
        if: steps.key.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.out.outputs.version }}
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "v$V zaten yayında; yeni sürüm için package.json ve APP_VERSION artırılır."
            exit 0
          fi
          cp "out/barista-clicker-$V.apk" out/barista-clicker.apk
          cat > notes.md <<EOF
          ## Telefona kurulum (Android)

          1. Bu sayfayı telefonunda aç ve aşağıdaki **barista-clicker.apk** dosyasına dokun.
          2. İndirme bitince dosyayı aç. Telefon "bilinmeyen uygulamalar" için izin isterse tarayıcına bir kerelik izin ver.
          3. Yeni sürüm çıkınca aynı şekilde indirip kurman yeterli; ilerlemen silinmez.

          Tarayıcıda oynadığın oyunun ilerlemesi uygulamaya geçmez (bulut kaydı ileride gelecek).

          Sürüm $V · Play Store'dan önceki deneme sürümü.
          EOF
          gh release create "v$V" out/barista-clicker.apk "out/barista-clicker-$V.apk" \
            --target "$GITHUB_SHA" --title "Barista Clicker $V" --notes-file notes.md
          echo "::notice title=Yayınlandı::v$V · https://github.com/$GITHUB_REPOSITORY/releases/latest/download/barista-clicker.apk"
